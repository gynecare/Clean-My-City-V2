name: Keep alive and health check

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 06:00 UTC
  workflow_dispatch:       # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint (fails if the database is unreachable)
        run: curl -fsS --retry 3 --retry-delay 10 https://clean-my-city-v2.vercel.app/api/health