name: Weekly reports backup

on:
  schedule:
    - cron: '0 3 * * 1'   # every Monday at 03:00 UTC
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Download CSV export
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            -H "x-admin-key: $ADMIN_KEY" \
            -o "reports-$(date +%F).csv" \
            https://clean-my-city-v2.vercel.app/api/reports/export
      - name: Save backup
        uses: actions/upload-artifact@v4
        with:
          name: reports-backup
          path: reports-*.csv
          retention-days: 90